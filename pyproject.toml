[project]
name = "gdgn-re"
version = "0.1.0"
description = "GDGN rebuild-2026：肿瘤药物敏感性预测（主任务 LCO）"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pubchempy>=1.0.5",
    "pyarrow>=25.0.1",
    "pypdf>=6.19.0",
    "rdkit>=2026.3.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch==2.12",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126" },
]

[tool.uv]
environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "pytest",
]
